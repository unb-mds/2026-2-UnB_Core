site_name: Unb Core — Documentação
site_description: Base de conhecimento acadêmica colaborativa dos cursos do campus do Gama (FCTE) da UnB.
site_author: Unb Core — MDS 2026/2 (UnB)
site_url: https://unb-mds.github.io/2026-2-UnB_Core/

repo_name: unb-mds/2026-2-UnB_Core
repo_url: https://github.com/unb-mds/2026-2-UnB_Core/tree/main/docs

theme:
  name: material
  language: pt
  palette:
    - scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Mudar para modo claro
    - scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: Mudar para modo escuro
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.tabs.link
  icon:
    repo: fontawesome/brands/github

plugins:
  - search:
      lang: pt

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  


name: Copiar README para a documentação
run: cp README.md docs/index.md

nav:
  - Início: index.md
  - Como rodar o projeto: como-rodar.md
  - Backups e restauração: backups.md
  #- Releases:
     # - Release 1 (R1): releases/release1.md
      #- Release 2 (R2): releases/release2.md
  #- Scrum:
      #- Scrum 0: scrum/Scrum 0.md
     # - Scrum 1: scrum/Scrum 1.md
     # - Scrum 2: scrum/Scrum 2.md
     # - Scrum 3: scrum/Scrum 3.md
  
  - Sprint:
    - Sprint 01: Sprint/Sprint01.md
    - Sprint 02: Sprint/Sprint02.md
    - Sprint 03: Sprint/Sprint03.md
    - Sprint 04: Sprint/Sprint04.md
    - Sprint 05: Sprint/Sprint05.md
    - Sprint 06: Sprint/Sprint06.md
    - Sprint 07: Sprint/Sprint07.md
    - Sprint 08: Sprint/Sprint08.md
    - Sprint 09: Sprint/Sprint09.md


  - Requisitos:
      - Requisitos Gerais Oficiais: requisitos.md
  - Frontend:
      - Design system : frontend/design-system.md