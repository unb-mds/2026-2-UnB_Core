site_name: Unb Core — Documentação
site_description: Todas as informações da UnB em um unico lugar.
site_author: Unb Core — MDS 2026/2 (UnB)
site_url: https://unb-mds.github.io/2026-2-UnB_Core/
docs_dir: ..

repo_name: unb-mds/2026-2-UnB_Core
repo_url: https://github.com/unb-mds/2026-2-UnB_Core/tree/main/docs

theme:
  name: material
  language: pt
  palette:
    - scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Mudar para modo claro
    - scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: Mudar para modo escuro
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.tabs.link
  icon:
    repo: fontawesome/brands/github

plugins:
  - search:
      lang: pt

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true

nav:
  - Início: index.md
  - Uso de IA: ai-usage.md
  #- Releases:
     # - Release 1 (R1): releases/release1.md
      #- Release 2 (R2): releases/release2.md
  - Scrum:
      - Scrum 2: scrum/Scrum 2.md
      - Scrum 3: scrum/Scrum 3.md
      - Scrum 4: scrum/Scrum 4 28-09-26.md
      - Scrum 5: scrum/Scrum 5 02-10-26.md
      - Scrum 6: scrum/Scrum 6 14-10-26.md
      - Scrum 7: scrum/Scrum 7 27-10-26.md
  - Sprints:
      - Sprint 1: Sprint/Sprint01.md
      - Sprint 2: Sprint/Sprint02.md
      - Sprint 3: Sprint/Sprint03.md
      - Sprint 4: Sprint/Sprint04.md
      - Sprint 5: Sprint/Sprint05.md
      - Sprint 6: Sprint/Sprint06.md
      - Sprint 7: Sprint/Sprint07.md
      - Sprint 8: Sprint/Sprint08.md
      - Sprint 9: Sprint/Sprint09.md
  - Requisitos:
    #  - Levantamento Inicial: requisitos/levantamento_inicial.md
      - Requisitos Gerais Oficiais: requisitos.md
     # - Cobertura de Testes (Release 2): requisitos/cobertura_testes.md

  #- Frontend:
   #   - Sprint 0: frontend/Sprint 0.md

  #- Backend:
      #- Visão Geral: backend/backend.md
      #- Coerência Política e Carga Incremental: backend/coerencia_e_incremental.md
